# Tomcat
server:
  port: 9300

# Spring
spring: 
  application:
    # 应用名称
    name: erp-file
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - optional:nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}

mybatis:
  typeAliasesPackage: com.erp.file.drive.domain
  mapperLocations: classpath:mapper/**/*.xml

---
# 本地无 Nacos 启动配置：--spring.profiles.active=local
server:
  port: 9300

spring:
  config:
    activate:
      on-profile: local
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
