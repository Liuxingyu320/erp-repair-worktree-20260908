# Tomcat
server:
  port: 9205

# Spring
spring:
  application:
    name: erp-inventory
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
      config:
        server-addr: 127.0.0.1:8848
  config:
    file-extension: yml
    import:
      - optional:nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}
  datasource:
    druid:
      stat-view-servlet:
        enabled: ${DRUID_MONITOR_ENABLED:false}
        loginUsername: ${DRUID_MONITOR_USERNAME:}
        loginPassword: ${DRUID_MONITOR_PASSWORD:}
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/${MYSQL_DATABASE:BossERP_NEW}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
          username: ${MYSQL_USERNAME:root}
          password: ${MYSQL_PASSWORD:}

mybatis:
  typeAliasesPackage: com.erp.inventory
  mapperLocations: classpath:mapper/**/*.xml

# 只填写可信购买站点主机名，逗号分隔，不含协议、端口或路径。
# 保持空值时后端拒绝保存外部购买链接，避免误把任意网址发给门店员工。
inventory:
  oe:
    purchase-reference:
      allowed-hosts: ${INVENTORY_OE_PURCHASE_REFERENCE_ALLOWED_HOSTS:}

---
# 本地无 Nacos 启动配置：--spring.profiles.active=local
server:
  port: 9205

spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            erp-inventory:
              - uri: http://127.0.0.1:9205
            erp-system:
              - uri: http://127.0.0.1:9201
            erp-file:
              - uri: http://127.0.0.1:9300
            erp-approval:
              - uri: http://127.0.0.1:9206
  datasource:
    druid:
      stat-view-servlet:
        enabled: ${DRUID_MONITOR_ENABLED:false}
        loginUsername: ${DRUID_MONITOR_USERNAME:}
        loginPassword: ${DRUID_MONITOR_PASSWORD:}
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://127.0.0.1:3306/${MYSQL_DATABASE:BossERP_NEW}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
          username: ${MYSQL_USERNAME:root}
          password: ${MYSQL_PASSWORD:}

mybatis:
  typeAliasesPackage: com.erp.inventory
  mapperLocations: classpath:mapper/**/*.xml

springdoc:
  gatewayUrl: http://localhost:8080/${spring.application.name}
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  info:
    title: '进销存模块接口文档'
    description: '进销存模块接口描述'
    contact:
      name: ERP
      url: https://erp.vip
