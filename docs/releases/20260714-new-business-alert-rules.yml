groups:
  - name: erp-new-business-20260714
    interval: 1m
    rules:
      - alert: ErpNewBusinessOeOutboxDead
        expr: max(erp_oa_oe_outbox_dead) > 0
        for: 0m
        labels:
          severity: critical
          release: new-business-20260714
        annotations:
          summary: OE补货发件箱存在死信
          description: 立即暂停OA端新上报入口，处理或重放死信；库存端在途需求继续运行。

      - alert: ErpNewBusinessOeOutboxStalled
        expr: max(erp_oa_oe_outbox_age) > 900
        for: 5m
        labels:
          severity: critical
          release: new-business-20260714
        annotations:
          summary: OE补货发件箱最老待投递超过15分钟
          description: 检查OA到库存服务链路、重试队列和SENDING状态恢复。

      - alert: ErpNewBusinessOeOutboxRetryBacklog
        expr: max(erp_oa_oe_outbox_retry) > 0
        for: 15m
        labels:
          severity: warning
          release: new-business-20260714
        annotations:
          summary: OE补货发件箱重试持续积压
          description: 核对库存服务可用性及最近的HTTP失败原因。

      - alert: ErpNewBusinessCustomerScopeDeniedSpike
        expr: sum(increase(erp_inventory_customer_card_scope_denied_total[15m])) > 10
        for: 5m
        labels:
          severity: warning
          release: new-business-20260714
        annotations:
          summary: 客户服务卡跨店拒绝次数异常升高
          description: 检查门店上下文切换、角色范围和是否存在越权探测。

      - alert: ErpNewBusinessCustomerOptimisticConflictSpike
        expr: sum(increase(erp_inventory_customer_card_write_total{outcome="optimistic_conflict"}[15m])) > 10
        for: 5m
        labels:
          severity: warning
          release: new-business-20260714
        annotations:
          summary: 客户服务卡乐观锁冲突异常升高
          description: 检查重复编辑、移动端重试和客户端版本刷新逻辑。

      - alert: ErpNewBusinessHealthReminderFailure
        expr: sum(increase(erp_hr_health_certificate_reminder_total{outcome="failure"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          release: new-business-20260714
        annotations:
          summary: 健康证提醒任务发生失败
          description: 检查提醒调度、用户消息写入及失败日志，不影响健康证主流程。

      - alert: ErpNewBusinessReconciliationFailed
        expr: max(erp_new_business_reconciliation_success) == 0
        for: 0m
        labels:
          severity: critical
          release: new-business-20260714
        annotations:
          summary: 新增业务只读对账发现异常
          description: 查看脱敏计数并创建运维工单；不要把原始客户或员工明细发到告警渠道。

      - alert: ErpNewBusinessReconciliationStale
        expr: absent(erp_new_business_reconciliation_last_run_timestamp_seconds) or (time() - max(erp_new_business_reconciliation_last_run_timestamp_seconds) > 93600)
        for: 10m
        labels:
          severity: critical
          release: new-business-20260714
        annotations:
          summary: 新增业务对账超过26小时未成功产出结果
          description: 检查定时任务、只读数据库账号和node_exporter textfile目录。

      - alert: ErpNewBusinessOeDemandStalled24h
        expr: max(erp_new_business_reconciliation_issue_total{issue_code="OE_DEMAND_STALLED_24H"}) > 0
        for: 0m
        labels:
          severity: warning
          release: new-business-20260714
        annotations:
          summary: OE补货需求超过24小时未处理
          description: 通知对应仓库负责人处理；不要关闭库存端在途入口。

      - alert: ErpNewBusinessTransferDiscrepancyOverdue24h
        expr: max(erp_new_business_reconciliation_issue_total{issue_code="TRANSFER_DISCREPANCY_OVERDUE_24H"}) > 0
        for: 0m
        labels:
          severity: critical
          release: new-business-20260714
        annotations:
          summary: 调拨差异超过24小时未结
          description: 跟进短少、残损、拒收或待质检处置，差异关闭前不能完成调拨。
