# Tomcat
server: 
  port: 9200

# Spring
spring: 
  application:
    # 应用名称
    name: erp-auth
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - optional:nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}

auth:
  session:
    mode: bearer
    cookie-name: ERP_SESSION
    csrf-cookie-name: XSRF-TOKEN
    cookie-path: /
    same-site: Lax
    secure: true
    csrf-enabled: true
    max-age: 720m

---
# 本地无 Nacos 启动配置：--spring.profiles.active=local
server:
  port: 9200

spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            erp-system:
              - uri: http://127.0.0.1:9201

auth:
  session:
    mode: dual
    secure: false
