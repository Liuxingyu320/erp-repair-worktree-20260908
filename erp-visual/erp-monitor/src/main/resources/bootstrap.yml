# Tomcat
server:
  port: 9100

# Spring
spring: 
  application:
    # 应用名称
    name: erp-monitor
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
  config:
    # 配置文件格式
    file-extension: yml
    import:
      - optional:nacos:application-${spring.profiles.active}.${spring.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.config.file-extension}

# Required before enabling this optional service; never commit credentials.
erp:
  monitor:
    accounts:
      admin-username: ${ERP_MONITOR_ADMIN_USERNAME:}
      admin-password: ${ERP_MONITOR_ADMIN_PASSWORD:}
      registration-enabled: ${ERP_MONITOR_REGISTRATION_ENABLED:false}
      registrar-username: ${ERP_MONITOR_REGISTRAR_USERNAME:}
      registrar-password: ${ERP_MONITOR_REGISTRAR_PASSWORD:}
management:
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      roles: MONITOR_ADMIN
